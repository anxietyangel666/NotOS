<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #f2f3f5;
    }

    .splash-container {
      width: 320px;
      height: 380px;
      margin: auto;
      background: linear-gradient(165deg, #1b1d24 0%, #111216 100%);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.7),
        0 4px 16px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px 20px;
      position: relative;
      -webkit-app-region: drag;
    }

    /* Top drag region & close button */
    .splash-topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 20px;
    }

    .splash-close {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 13px;
      line-height: 1;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .splash-close:hover {
      background: rgba(235, 66, 66, 0.85);
      color: #ffffff;
    }

    /* Central logo with glowing pulse */
    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -6px;
    }

    .logo-glow {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(42, 171, 238, 0.4) 0%, rgba(42, 171, 238, 0) 70%);
      animation: pulse-glow 3s infinite ease-in-out;
      pointer-events: none;
    }

    .logo-ring {
      position: absolute;
      width: 94px;
      height: 94px;
      border-radius: 50%;
      border: 1.5px solid rgba(42, 171, 238, 0.3);
      animation: spin-slow 12s linear infinite;
      pointer-events: none;
    }

    .app-logo {
      width: 74px;
      height: 74px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      animation: float-logo 3.5s ease-in-out infinite;
      z-index: 1;
      object-fit: cover;
    }

    @keyframes float-logo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.15); }
    }

    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Titles */
    .app-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #ffffff;
      margin-top: 4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .status-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .status-title {
      font-size: 14px;
      font-weight: 600;
      color: #e3e5e8;
      letter-spacing: 0.2px;
      min-height: 18px;
      transition: color 0.2s ease;
    }

    .status-detail {
      font-size: 11.5px;
      color: #949ba4;
      min-height: 16px;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Animated spinner */
    .spinner-wrap {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      margin-top: 2px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #2AABEE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Progress bar */
    .progress-box {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .progress-box.active {
      display: flex;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2AABEE 0%, #00e5ff 100%);
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(42, 171, 238, 0.6);
      transition: width 0.15s ease-out;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #949ba4;
      font-variant-numeric: tabular-nums;
    }

    /* Footer */
    .splash-footer {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="splash-topbar">
      <button class="splash-close" id="btn-close" title="Закрыть" aria-label="Закрыть">&times;</button>
    </div>

    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <div class="logo-ring"></div>
      <img class="app-logo" id="app-logo" src="../public/Emoji/app-icon.png" alt="NotOS" />
    </div>

    <div class="app-name">NotOS</div>

    <div class="status-section">
      <div class="status-title" id="status-title">Проверка обновлений...</div>
      <div class="status-detail" id="status-detail">Подключение к серверу...</div>

      <div class="spinner-wrap" id="spinner-wrap">
        <div class="spinner"></div>
      </div>

      <div class="progress-box" id="progress-box">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-stats">
          <span id="progress-percent">0%</span>
          <span id="progress-bytes"></span>
        </div>
      </div>
    </div>

    <div class="splash-footer" id="app-version">v0.5.0</div>
  </div>

  <script>
    const titleEl = document.getElementById('status-title');
    const detailEl = document.getElementById('status-detail');
    const spinnerWrap = document.getElementById('spinner-wrap');
    const progressBox = document.getElementById('progress-box');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const progressBytes = document.getElementById('progress-bytes');
    const versionEl = document.getElementById('app-version');
    const closeBtn = document.getElementById('btn-close');
    const logoImg = document.getElementById('app-logo');

    // Fallback if public path is relative to dist in production
    logoImg.onerror = () => {
      logoImg.src = '../dist/Emoji/app-icon.png';
    };

    if (closeBtn && window.splashApi?.close) {
      closeBtn.addEventListener('click', () => {
        window.splashApi.close();
      });
    }

    if (window.splashApi?.onUpdate) {
      window.splashApi.onUpdate((data) => {
        if (!data) return;

        if (data.version) {
          versionEl.textContent = 'v' + data.version;
        }

        if (data.title) {
          titleEl.textContent = data.title;
        }

        if (data.detail !== undefined) {
          detailEl.textContent = data.detail;
        }

        if (data.status === 'downloading') {
          spinnerWrap.style.display = 'none';
          progressBox.classList.add('active');
          const percent = Math.min(100, Math.max(0, Math.round(data.percent || 0)));
          progressFill.style.width = percent + '%';
          progressPercent.textContent = percent + '%';

          if (data.downloaded !== undefined && data.total) {
            const mbDown = (data.downloaded / (1024 * 1024)).toFixed(1);
            const mbTotal = (data.total / (1024 * 1024)).toFixed(1);
            progressBytes.textContent = mbDown + ' / ' + mbTotal + ' МБ';
          }
        } else if (data.status === 'installing') {
          spinnerWrap.style.display = 'grid';
          progressBox.classList.remove('active');
          titleEl.style.color = '#38ef7d';
        } else if (data.status === 'ready') {
          spinnerWrap.style.display = 'none';
          progressBox.classList.remove('active');
          titleEl.style.color = '#2AABEE';
        } else if (data.status === 'offline') {
          spinnerWrap.style.display = 'none';
          progressBox.classList.remove('active');
          titleEl.style.color = '#f59e0b';
        } else {
          spinnerWrap.style.display = 'grid';
          progressBox.classList.remove('active');
          titleEl.style.color = '#e3e5e8';
        }
      });
    }
  </script>
</body>
</html>
